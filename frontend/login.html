<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Войти — Идея</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--warm-bg);
            padding: 2rem;
        }
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 24px rgba(61,43,31,0.10);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .auth-logo a {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            color: var(--brown-dark);
            text-decoration: none;
        }
        .auth-logo span {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            font-style: italic;
            margin-top: 2px;
        }
        .auth-tabs {
            display: flex;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 1.75rem;
        }
        .auth-tab {
            flex: 1;
            padding: 9px;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
            font-family: var(--font-body);
            border: none;
            background: none;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .auth-tab.active {
            background: var(--accent);
            color: #fff;
        }
        .auth-tab:hover:not(.active) {
            background: var(--warm-bg);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-label {
            display: block;
            font-size: 13px;
            color: var(--brown-mid);
            margin-bottom: 5px;
        }
        .form-input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            font-family: var(--font-body);
            color: var(--brown-dark);
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            border-color: var(--accent);
        }
        .form-submit {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-size: 15px;
            font-family: var(--font-body);
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }
        .form-submit:hover { background: #9E4A20; }
        .form-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .auth-footer {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 13px;
            color: var(--text-muted);
        }
        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
        }
        .auth-footer a:hover { text-decoration: underline; }
        .auth-error {
            background: #fde8e8;
            border: 1px solid #f5c0c0;
            color: #c0392b;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <a href="index.html">Идея</a>
            <span>Онлайн-библиотека</span>
        </div>

        <!-- Переключатель пользователь / администратор -->
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('user')">Пользователь</button>
            <button class="auth-tab" onclick="switchTab('admin')">Администратор</button>
        </div>

        <div class="auth-error" id="auth-error"></div>

        <!-- Форма входа -->
        <div class="form-group">
            <label class="form-label" for="login">Логин</label>
            <input type="text" id="login" class="form-input" placeholder="Введите логин" />
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Пароль</label>
            <input type="password" id="password" class="form-input" placeholder="Введите пароль" />
        </div>

        <button class="form-submit" id="submit-btn" onclick="handleLogin()">Войти</button>

        <div class="auth-footer" id="auth-footer">
            Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
    let currentTab = "user";

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll(".auth-tab").forEach((btn, i) => {
            btn.classList.toggle("active", (i === 0 && tab === "user") || (i === 1 && tab === "admin"));
        });
        // Меняем ссылку на регистрацию в зависимости от вкладки
        document.getElementById("auth-footer").innerHTML = tab === "user"
            ? `Нет аккаунта? <a href="register.html">Зарегистрироваться</a>`
            : `Нет аккаунта? <a href="admin_register.html">Регистрация администратора</a>`;
        hideError();
    }

    async function handleLogin() {
        const login    = document.getElementById("login").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!login || !password) {
            showError("Заполните все поля");
            return;
        }

        const btn = document.getElementById("submit-btn");
        btn.disabled = true;
        btn.textContent = "Входим...";

        try {
            const path = currentTab === "user" ? "/auth/user/login" : "/auth/admin/login";
            const data = await apiFetch(path, {
                method: "POST",
                body: JSON.stringify({ login, password }),
            });

            if (!data.success) {
                showError(data.message || "Неверный логин или пароль");
                return;
            }

            // Сохраняем токен и логин
            saveAuth(data.token, login);

            // Перенаправляем в зависимости от роли
            if (currentTab === "admin") {
                // Сохраняем флаг что это админ
                localStorage.setItem("is_admin", "true");
                window.location.href = "admin_cabinet.html";
            } else {
                localStorage.removeItem("is_admin");
                window.location.href = "index.html";
            }

        } catch (err) {
            showError(err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = "Войти";
        }
    }

    function showError(msg) {
        const el = document.getElementById("auth-error");
        el.textContent = msg;
        el.style.display = "block";
    }

    function hideError() {
        document.getElementById("auth-error").style.display = "none";
    }

    // Если уже авторизован — перенаправляем
    if (isLoggedIn()) {
        window.location.href = localStorage.getItem("is_admin") === "true"
            ? "admin_cabinet.html"
            : "index.html";
    }
</script>
</body>
</html>
