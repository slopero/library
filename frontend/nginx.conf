# nginx.conf — конфигурация веб-сервера для фронтенда

server {
    # Слушаем порт 5000 внутри контейнера
    listen 5000;

    # Корневая папка — откуда раздавать файлы
    root /usr/share/nginx/html;

    # Файл по умолчанию при обращении к папке
    index index.html;

    # Основной блок — обработка всех запросов
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статики — CSS, JS, картинки
    # Браузер будет хранить их 1 день и не запрашивать повторно
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}