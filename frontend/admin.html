<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Панель управления — Идея</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .admin-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
        }
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .admin-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 600;
            color: var(--brown-dark);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 9px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-family: var(--font-body);
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #9E4A20; }

        /* Таблица книг */
        .books-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            font-size: 14px;
        }
        .books-table th {
            background: var(--warm-bg);
            padding: 12px 16px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }
        .books-table td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            color: var(--brown-dark);
            vertical-align: middle;
        }
        .books-table tr:last-child td { border-bottom: none; }
        .books-table tr:hover td { background: var(--warm-bg); }
        .btn-delete {
            background: none;
            border: 1px solid #f5c0c0;
            color: #c0392b;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-family: var(--font-body);
            transition: all 0.2s;
        }
        .btn-delete:hover { background: #fde8e8; }

        /* Модальное окно добавления книги */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 2rem;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 40px rgba(61,43,31,0.18);
        }
        .modal-title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--brown-dark);
        }
        .form-group { margin-bottom: 1rem; }
        .form-label {
            display: block;
            font-size: 13px;
            color: var(--brown-mid);
            margin-bottom: 5px;
        }
        .form-input, .form-textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 13px;
            font-size: 14px;
            font-family: var(--font-body);
            color: var(--brown-dark);
            background: #fff;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
        .form-textarea { resize: vertical; min-height: 90px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 1.25rem;
        }
        .btn-outline {
            background: none;
            color: var(--brown-mid);
            border: 1px solid var(--border);
            padding: 9px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-family: var(--font-body);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
        .modal-error {
            background: #fde8e8;
            border: 1px solid #f5c0c0;
            color: #c0392b;
            padding: 9px 13px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <a href="index.html" class="navbar__logo">
        Идея <span>Онлайн-библиотека</span>
    </a>
    <div class="navbar__links">
        <a href="admin_cabinet.html" class="navbar__link">← Личный кабинет</a>
        <div id="navbar-auth"></div>
    </div>
</nav>

<div class="admin-page">
    <div class="admin-header">
        <h1 class="admin-title">Управление книгами</h1>
        <button class="btn-primary" onclick="openModal()">+ Добавить книгу</button>
    </div>

    <div id="table-container">
        <div class="spinner"><div class="spinner__circle"></div></div>
    </div>
</div>

<!-- Модальное окно добавления книги -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal">
        <div class="modal-title">Добавить книгу</div>
        <div class="modal-error" id="modal-error"></div>

        <div class="form-group">
            <label class="form-label">Название</label>
            <input type="text" id="b-title" class="form-input" placeholder="Название книги" />
        </div>
        <div class="form-group">
            <label class="form-label">Авторы</label>
            <input type="text" id="b-authors" class="form-input" placeholder="Иванов И.И., Петров П.П." />
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Жанр</label>
                <input type="text" id="b-genre" class="form-input" placeholder="Роман" />
            </div>
            <div class="form-group">
                <label class="form-label">Язык</label>
                <input type="text" id="b-language" class="form-input" placeholder="Русский" />
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Год издания</label>
                <input type="number" id="b-year" class="form-input" placeholder="2024" min="0" max="2100" />
            </div>
            <div class="form-group">
                <label class="form-label">Цена (₽)</label>
                <input type="number" id="b-price" class="form-input" placeholder="499" min="0" step="0.01" />
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Описание <span style="color:var(--text-muted)">(необязательно)</span></label>
            <textarea id="b-description" class="form-textarea" placeholder="Краткое описание книги..."></textarea>
        </div>

        <div class="modal-actions">
            <button class="btn-primary" id="modal-submit" onclick="handleAddBook()">Добавить</button>
            <button class="btn-outline" onclick="closeModal()">Отмена</button>
        </div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
    // Защита страницы
    if (!isLoggedIn() || localStorage.getItem("is_admin") !== "true") {
        window.location.href = "login.html";
    }

    // ── Загрузка таблицы книг ─────────────────

    async function loadBooks() {
        try {
            const data = await apiFetch("/books/?sort=title");
            renderTable(data.items);
        } catch (err) {
            document.getElementById("table-container").innerHTML =
                `<div class="error-message">⚠️ ${err.message}</div>`;
        }
    }

    function renderTable(books) {
        if (books.length === 0) {
            document.getElementById("table-container").innerHTML =
                `<div class="empty-state">
                    <div class="empty-state__icon">📚</div>
                    <div class="empty-state__text">Книг пока нет</div>
                    <div class="empty-state__sub">Добавьте первую книгу</div>
                </div>`;
            return;
        }

        const rows = books.map(b => `
            <tr>
                <td>${escapeHtml(b.title)}</td>
                <td>${escapeHtml(b.authors)}</td>
                <td>${escapeHtml(b.genre)}</td>
                <td>${b.year}</td>
                <td>${escapeHtml(b.language)}</td>
                <td>${formatPrice(b.price)} ₽</td>
                <td>
                    <button class="btn-delete" onclick="handleDelete(${b.id}, '${escapeHtml(b.title)}')">
                        Удалить
                    </button>
                </td>
            </tr>`).join("");

        document.getElementById("table-container").innerHTML = `
            <table class="books-table">
                <thead>
                    <tr>
                        <th>Название</th>
                        <th>Авторы</th>
                        <th>Жанр</th>
                        <th>Год</th>
                        <th>Язык</th>
                        <th>Цена</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>`;
    }

    // ── Добавление книги ──────────────────────

    function openModal() {
        document.getElementById("modal-overlay").classList.add("open");
    }

    function closeModal() {
        document.getElementById("modal-overlay").classList.remove("open");
        document.getElementById("modal-error").style.display = "none";
        // Очищаем поля
        ["b-title","b-authors","b-genre","b-language","b-year","b-price","b-description"]
            .forEach(id => document.getElementById(id).value = "");
    }

    function closeModalOnOverlay(e) {
        if (e.target === document.getElementById("modal-overlay")) closeModal();
    }

    async function handleAddBook() {
        const title       = document.getElementById("b-title").value.trim();
        const authors     = document.getElementById("b-authors").value.trim();
        const genre       = document.getElementById("b-genre").value.trim();
        const language    = document.getElementById("b-language").value.trim();
        const year        = document.getElementById("b-year").value;
        const price       = document.getElementById("b-price").value;
        const description = document.getElementById("b-description").value.trim();

        if (!title || !authors || !genre || !language || !year || !price) {
            showModalError("Заполните все обязательные поля");
            return;
        }

        const btn = document.getElementById("modal-submit");
        btn.disabled = true;
        btn.textContent = "Добавляем...";

        try {
            await apiFetch("/books/", {
                method: "POST",
                body: JSON.stringify({
                    title, authors, genre, language,
                    year: parseInt(year),
                    price: parseFloat(price),
                    description: description || null,
                }),
            });

            closeModal();
            loadBooks();

        } catch (err) {
            showModalError(err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = "Добавить";
        }
    }

    // ── Удаление книги ────────────────────────

    async function handleDelete(bookId, title) {
        if (!confirm(`Удалить книгу "${title}"?`)) return;

        try {
            await apiFetch(`/books/${bookId}`, { method: "DELETE" });
            loadBooks();
        } catch (err) {
            alert(err.message);
        }
    }

    // ── Вспомогательные ───────────────────────

    function showModalError(msg) {
        const el = document.getElementById("modal-error");
        el.textContent = msg;
        el.style.display = "block";
    }

    function escapeHtml(str) {
        return String(str || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function formatPrice(price) {
        return Number(price).toLocaleString("ru-RU");
    }

    document.addEventListener("DOMContentLoaded", loadBooks);
</script>
</body>
</html>
