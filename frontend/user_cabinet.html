<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Личный кабинет — Идея</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .cabinet-page { max-width:860px; margin:2.5rem auto; padding:0 2rem; }
        .cabinet-card { background:var(--card-bg); border:1px solid var(--border); border-radius:14px; padding:2.5rem; box-shadow:0 4px 24px rgba(61,43,31,0.08); margin-bottom:1.5rem; }
        .cabinet-header { display:flex; align-items:center; gap:1.5rem; margin-bottom:2rem; padding-bottom:1.5rem; border-bottom:1px solid var(--border); }
        .cabinet-avatar { width:72px; height:72px; border-radius:50%; background:var(--accent-light); display:flex; align-items:center; justify-content:center; font-size:32px; flex-shrink:0; }
        .cabinet-name { font-family:var(--font-display); font-size:22px; font-weight:600; color:var(--brown-dark); margin-bottom:4px; }
        .cabinet-role { font-size:13px; color:var(--text-muted); font-style:italic; }
        .cabinet-fields { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; margin-bottom:2rem; }
        .cabinet-field label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); margin-bottom:4px; }
        .cabinet-field span { font-size:15px; color:var(--brown-dark); }
        .cabinet-actions { display:flex; gap:12px; flex-wrap:wrap; }
        .btn-primary { background:var(--accent); color:#fff; border:none; padding:10px 24px; border-radius:8px; font-size:14px; font-family:var(--font-body); cursor:pointer; text-decoration:none; transition:background 0.2s; display:inline-flex; align-items:center; gap:8px; }
        .btn-primary:hover { background:#9E4A20; }
        .btn-outline { background:none; color:var(--brown-mid); border:1px solid var(--border); padding:10px 24px; border-radius:8px; font-size:14px; font-family:var(--font-body); cursor:pointer; transition:all 0.2s; }
        .btn-outline:hover { border-color:var(--accent); color:var(--accent); }
        .section-title { font-family:var(--font-display); font-size:20px; font-weight:600; color:var(--brown-dark); margin-bottom:1rem; padding-bottom:0.75rem; border-bottom:1px solid var(--border); }
        .purchase-item { display:flex; align-items:center; gap:1rem; padding:0.75rem 0; border-bottom:1px solid var(--border); }
        .purchase-item:last-child { border-bottom:none; }
        .purchase-cover { width:44px; height:60px; border-radius:5px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:20px; }
        .purchase-info { flex:1; }
        .purchase-title { font-family:var(--font-display); font-size:14px; font-weight:600; color:var(--brown-dark); }
        .purchase-author { font-size:12px; color:var(--text-muted); font-style:italic; }
        .purchase-price { font-size:14px; font-weight:600; color:var(--accent); }
        .purchase-date { font-size:11px; color:var(--text-muted); }
    </style>
</head>
<body>
<nav class="navbar">
    <a href="index.html" class="navbar__logo">Идея <span>Онлайн-библиотека</span></a>
    <div class="navbar__links">
        <a href="index.html" class="navbar__link">Главная</a>
        <a href="cart.html" class="navbar__link">Корзина <span class="navbar__badge" id="cart-badge" style="display:none">0</span></a>
        <a href="favorites.html" class="navbar__link">Избранное</a>
        <div id="navbar-auth"></div>
    </div>
</nav>

<div class="cabinet-page">
    <div class="cabinet-card" id="cabinet-card">
        <div class="spinner"><div class="spinner__circle"></div></div>
    </div>
    <div class="cabinet-card" id="purchases-card" style="display:none">
        <div class="section-title">Купленные книги</div>
        <div id="purchases-list"></div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
    if (!isLoggedIn() || localStorage.getItem("is_admin") === "true") {
        window.location.href = "login.html";
    }

    const COLORS = ["c1","c2","c3","c4","c5","c6","c7","c8"];
    function pickColor(id) { return COLORS[id % COLORS.length]; }
    function escapeHtml(str) { return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function formatDate(val) { if (!val) return "—"; const [y,m,d]=val.split("-"); return `${d}.${m}.${y}`; }
    function formatPrice(p) { return Number(p).toLocaleString("ru-RU"); }

    async function loadCabinet() {
        try {
            const data = await apiFetch("/auth/me");
            document.getElementById("cabinet-card").innerHTML = `
                <div class="cabinet-header">
                    <div class="cabinet-avatar">👤</div>
                    <div>
                        <div class="cabinet-name">${escapeHtml(data.full_name)}</div>
                        <div class="cabinet-role">Пользователь</div>
                    </div>
                </div>
                <div class="cabinet-fields">
                    <div class="cabinet-field"><label>Email</label><span>${escapeHtml(data.email)}</span></div>
                    <div class="cabinet-field"><label>Дата рождения</label><span>${formatDate(data.birth_date)}</span></div>
                    <div class="cabinet-field"><label>Дата регистрации</label><span>${formatDate(data.registered_at)}</span></div>
                </div>
                <div class="cabinet-actions">
                    <a href="favorites.html" class="btn-primary">❤️ Избранное</a>
                    <a href="cart.html" class="btn-primary">🛒 Корзина</a>
                    <button class="btn-outline" onclick="logout()">Выйти</button>
                </div>`;
        } catch (err) {
            document.getElementById("cabinet-card").innerHTML = `<div class="error-message">⚠️ ${err.message}</div>`;
        }
    }

    async function loadPurchases() {
        try {
            const data = await apiFetch("/purchases/");
            const card = document.getElementById("purchases-card");
            const list = document.getElementById("purchases-list");

            if (!data.items.length) {
                list.innerHTML = `<div style="color:var(--text-muted);font-style:italic;padding:1rem 0">Купленных книг пока нет</div>`;
            } else {
                list.innerHTML = data.items.map(p => `
                    <div class="purchase-item">
                        <div class="purchase-cover book-card__cover--${pickColor(p.book.id)}">📖</div>
                        <div class="purchase-info">
                            <div class="purchase-title">
                                <a href="book.html?id=${p.book.id}" style="text-decoration:none;color:inherit">${escapeHtml(p.book.title)}</a>
                            </div>
                            <div class="purchase-author">${escapeHtml(p.book.authors)}</div>
                            <div class="purchase-date">Куплено: ${formatDate(p.purchased_at)}</div>
                        </div>
                        <div class="purchase-price">${formatPrice(p.price_paid)} ₽</div>
                    </div>`).join("");
            }
            card.style.display = "block";
        } catch (err) { console.error(err); }
    }

    document.addEventListener("DOMContentLoaded", () => {
        updateCartBadge(getCartCount());
        loadCabinet();
        loadPurchases();
    });
</script>
</body>
</html>
