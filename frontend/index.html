<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Идея — Онлайн-библиотека</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ── Навигация ─────────────────────────────── -->
<nav class="navbar">
    <a href="index.html" class="navbar__logo">
        Идея
        <span>Онлайн-библиотека</span>
    </a>
    <div class="navbar__links">
        <a href="index.html" class="navbar__link navbar__link--active">Главная</a>
        <a href="cart.html" class="navbar__link">
            Корзина
            <span class="navbar__badge" id="cart-badge" style="display:none">0</span>
        </a>
        <a href="favorites.html" class="navbar__link">Избранное</a>
        <!-- Сюда auth.js вставит либо "Войти", либо логин пользователя -->
        <div id="navbar-auth"></div>
    </div>
</nav>

<!-- ── Герой с поиском ───────────────────────── -->
<section class="hero">
    <h1 class="hero__title">Найдите свою следующую книгу</h1>
    <p class="hero__sub">Тысячи книг — один поиск</p>
    <div class="hero__search">
        <input
            type="text"
            id="search-input"
            class="hero__search-input"
            placeholder="Название или автор..."
            oninput="onSearchInput(this.value)"
        />
        <button class="hero__search-btn" onclick="onSearchInput(document.getElementById('search-input').value)">
            🔍
        </button>
    </div>
</section>

<!-- ── Стили для секций hero и toolbar ──────── -->
<style>
    .hero {
        background: var(--warm-bg);
        padding: 2.5rem 2rem 2rem;
        text-align: center;
        border-bottom: 1px solid var(--border);
    }
    .hero__title {
        font-family: var(--font-display);
        font-size: 34px;
        font-weight: 700;
        color: var(--brown-dark);
        margin-bottom: 0.4rem;
    }
    .hero__sub {
        font-size: 15px;
        color: var(--text-muted);
        margin-bottom: 1.5rem;
        font-style: italic;
    }
    .hero__search {
        max-width: 580px;
        margin: 0 auto;
        display: flex;
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 2px 16px rgba(61,43,31,0.08);
    }
    .hero__search-input {
        flex: 1;
        border: none;
        outline: none;
        padding: 12px 18px;
        font-size: 15px;
        font-family: var(--font-body);
        color: var(--brown-dark);
        background: transparent;
    }
    .hero__search-input::placeholder { color: var(--text-muted); }
    .hero__search-btn {
        background: var(--accent);
        border: none;
        padding: 0 22px;
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        transition: background 0.2s;
    }
    .hero__search-btn:hover { background: #9E4A20; }

    /* Панель фильтров */
    .toolbar {
        max-width: 1100px;
        margin: 1.5rem auto 0;
        padding: 0 2rem;
        display: flex;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
    }
    .toolbar__group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .toolbar__label {
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .toolbar__input, .toolbar__select {
        border: 1px solid var(--border);
        background: var(--card-bg);
        color: var(--brown-dark);
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 8px;
        font-family: var(--font-body);
        outline: none;
        min-width: 120px;
    }
    .toolbar__input:focus, .toolbar__select:focus {
        border-color: var(--accent);
    }
    .toolbar__year-row {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .toolbar__year-row input {
        width: 80px;
    }
    .toolbar__apply-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 7px 16px;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        font-family: var(--font-body);
        transition: background 0.2s;
        align-self: flex-end;
    }
    .toolbar__apply-btn:hover { background: #9E4A20; }
    .toolbar__reset-btn {
        background: none;
        color: var(--text-muted);
        border: 1px solid var(--border);
        padding: 7px 16px;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
        font-family: var(--font-body);
        transition: all 0.2s;
        align-self: flex-end;
    }
    .toolbar__reset-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    /* Сортировка и счётчик */
    .results-bar {
        max-width: 1100px;
        margin: 1rem auto 0;
        padding: 0 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .results-bar__info {
        font-size: 13px;
        color: var(--text-muted);
        font-style: italic;
    }
    .results-bar__sort {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text-muted);
    }
    .results-bar__sort select {
        border: 1px solid var(--border);
        background: var(--card-bg);
        color: var(--brown-mid);
        font-size: 13px;
        padding: 5px 10px;
        border-radius: 8px;
        font-family: var(--font-body);
        cursor: pointer;
        outline: none;
    }
    .results-bar__sort select:focus { border-color: var(--accent); }

    /* Сетка книг */
    .content {
        padding: 1.25rem 2rem 0;
        max-width: 1100px;
        margin: 0 auto;
    }
    .books-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1.25rem;
    }
</style>

<!-- ── Фильтры ───────────────────────────────── -->
<div class="toolbar">
    <div class="toolbar__group">
        <label class="toolbar__label" for="filter-genre">Жанр</label>
        <input
            type="text"
            id="filter-genre"
            class="toolbar__input"
            placeholder="Например: роман"
        />
    </div>
    <div class="toolbar__group">
        <label class="toolbar__label" for="filter-language">Язык</label>
        <select id="filter-language" class="toolbar__select">
            <option value="">Все языки</option>
            <option value="Русский">Русский</option>
            <option value="Английский">Английский</option>
            <option value="Французский">Французский</option>
            <option value="Немецкий">Немецкий</option>
        </select>
    </div>
    <div class="toolbar__group">
        <label class="toolbar__label">Год издания</label>
        <div class="toolbar__year-row">
            <input
                type="number"
                id="filter-year-from"
                class="toolbar__input"
                placeholder="От"
                min="0"
                max="2100"
            />
            <span style="color: var(--text-muted)">—</span>
            <input
                type="number"
                id="filter-year-to"
                class="toolbar__input"
                placeholder="До"
                min="0"
                max="2100"
            />
        </div>
    </div>
    <button class="toolbar__apply-btn" onclick="onFilterChange()">Применить</button>
    <button class="toolbar__reset-btn" onclick="resetFilters()">Сбросить</button>
</div>

<!-- ── Счётчик и сортировка ──────────────────── -->
<div class="results-bar">
    <span class="results-bar__info" id="results-info"></span>
    <div class="results-bar__sort">
        Сортировка:
        <select onchange="onSortChange(this.value)">
            <option value="title">По алфавиту</option>
            <option value="author">По автору</option>
            <option value="year">По году</option>
        </select>
    </div>
</div>

<!-- ── Сетка книг ────────────────────────────── -->
<div class="content">
    <div class="books-grid" id="books-grid">
        <!-- Карточки отрисовываются через JS -->
    </div>
</div>

<!-- ── Пагинация ─────────────────────────────── -->
<div class="pagination" id="pagination"></div>

<!-- Скрипты подключаются в конце body.
     Порядок важен: config.js → auth.js → index.js
     Каждый следующий файл может использовать переменные из предыдущего. -->
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/index.js"></script>
</body>
</html>
